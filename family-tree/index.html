<script>
  // Apply saved language/theme before first paint to avoid a flash.
  (function () {
    try {
      var l = localStorage.getItem('gft.lang');
      if (l === 'en' || l === 'ar') { document.documentElement.lang = l; document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr'; }
      var th = localStorage.getItem('gft.theme');
      if (th === 'dark' || th === 'light') document.documentElement.dataset.theme = th;
      else if (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark';
    } catch (e) {}
  })();
</script>
